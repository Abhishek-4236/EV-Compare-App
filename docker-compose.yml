services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ev-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-ev_compare}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ev-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ev-backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-ev_compare}
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: 1
      APP_ENV: ${APP_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      OPENAI_ENABLED: ${OPENAI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL_ENABLED: ${GROQ_MODEL_ENABLED:-false}
      HF_API_KEY: ${HF_API_KEY:-}
      HF_MODEL_ENABLED: ${HF_MODEL_ENABLED:-false}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_RERANK_ENABLED: ${NVIDIA_RERANK_ENABLED:-false}
      AUTO_OPEN_BROWSER: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ev-network
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - __pycache__
            - .pytest_cache
            - "*.pyc"
        - action: rebuild
          path: ./backend/requirements.txt

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - ev-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ev-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - ev-network
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: rebuild
          path: ./frontend/package.json

volumes:
  postgres_data:

networks:
  ev-network:
    driver: bridge

